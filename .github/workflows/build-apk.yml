
name: Build Apple Maps APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'icon512.png'
      - 'icon192.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/cli @capacitor/core @capacitor/android
          mkdir -p app
          cp index.html app/index.html
          npx cap init "Apple Maps" "com.maksimilutin.applemaps" --web-dir=app
          npx cap add android
          npx cap sync android

      - name: Set app icons
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("icon512.png")
          if not source.exists():
              source = Path("icon192.png")
          if not source.exists():
              raise SystemExit("ERROR: icon512.png and icon192.png were not found in repository root")

          image = Image.open(source).convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          res = Path("android/app/src/main/res")
          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(target / "ic_launcher.png")
              image.resize((size, size), Image.Resampling.LANCZOS).save(target / "ic_launcher_round.png")

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          artwork = image.resize((324, 324), Image.Resampling.LANCZOS)
          foreground.alpha_composite(artwork, (54, 54))
          foreground.save(res / "mipmap-xxxhdpi" / "ic_launcher_foreground.png")

          (adaptive / "ic_launcher.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@android:color/white"/>\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          print("App icon configured from", source)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Maps-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
